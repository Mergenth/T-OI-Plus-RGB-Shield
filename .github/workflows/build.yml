name: Build firmware

on:
  push:
    paths:
      - "Claude/**"
      - "web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Compile Farbtest (T-OI Plus, ESP32-C3)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:ttgo-t-oi-plus \
            --output-dir build/rgb_shield \
            Claude/rgb_shield
          ls -l build/rgb_shield

      - name: Compile Laufschrift (T-OI Plus, ESP32-C3)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:ttgo-t-oi-plus \
            --output-dir build/laufschrift \
            Claude/laufschrift
          ls -l build/laufschrift

      - name: Compile Regenbogen (T-OI Plus, ESP32-C3)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:ttgo-t-oi-plus \
            --output-dir build/regenbogen \
            Claude/regenbogen
          ls -l build/regenbogen

      - name: Assemble flash page
        run: |
          mkdir site
          cp web/index.html web/manifest.json web/manifest-laufschrift.json web/manifest-regenbogen.json site/
          test -f build/rgb_shield/rgb_shield.ino.merged.bin
          test -f build/laufschrift/laufschrift.ino.merged.bin
          test -f build/regenbogen/regenbogen.ino.merged.bin
          cp build/rgb_shield/rgb_shield.ino.merged.bin site/firmware.merged.bin
          cp build/laufschrift/laufschrift.ino.merged.bin site/firmware-laufschrift.merged.bin
          cp build/regenbogen/regenbogen.ino.merged.bin site/firmware-regenbogen.merged.bin

      - name: Upload firmware files
        uses: actions/upload-artifact@v4
        with:
          name: firmware-t-oi-plus
          path: build/**/*.bin

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
